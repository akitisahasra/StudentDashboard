<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #2b5876; color: #fff; display:flex; justify-content:center; padding:20px;}
.container { background: rgba(0,0,0,0.4); padding: 25px; border-radius:10px; width:900px; }
form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { grid-column: span 2; margin-top:5px; }
input { padding:8px; border-radius:5px; border:none; width:100%; }
button { grid-column: span 2; padding:10px; margin-top:10px; border:none; border-radius:5px; background:#00c896; color:#fff; cursor:pointer; }
button:hover { background:#00a37a; }
table { width:100%; margin-top:20px; border-collapse: collapse; }
th,td { border-bottom:1px solid rgba(255,255,255,0.2); padding:8px; text-align:left; }
th { background: rgba(255,255,255,0.1); }
canvas { margin-top:20px; background: rgba(255,255,255,0.1); border-radius:8px; }
.summary { margin-top:20px; background: rgba(0,0,0,0.3); padding:10px; border-radius:8px;}
</style>
</head>
<body>
<div class="container">
<h1>Student Performance Dashboard</h1>

<form id="studentForm">
<label>Student Name</label>
<input type="text" id="name" required>
<label>Week Number</label>
<input type="number" id="week" min="1" required>
<label>Attendance (%)</label>
<input type="number" id="attendance" min="0" max="100" required>
<label>Internal Marks (0-40)</label>
<input type="number" id="internal" min="0" max="40" required>
<label>External Marks (0-60)</label>
<input type="number" id="external" min="0" max="60" required>
<label>Study Hours per Week</label>
<input type="number" id="studyHours" min="0" max="50" required>
<label>Behavior & Socio-economic Score (1-5)</label>
<input type="number" id="behavior" min="1" max="5" required>
<button type="button" onclick="addStudent()">Add Student</button>
</form>

<div id="dashboard" class="hidden">
<h2>Class Dashboard</h2>
<table id="studentTable">
<thead>
<tr>
<th>Name</th>
<th>Grade</th>
<th>Status</th>
<th>Risk</th>
<th>Recommendations</th>
</tr>
</thead>
<tbody></tbody>
</table>

<canvas id="classChart"></canvas>

<div class="summary">
<h3>Summary</h3>
<p id="summaryText"></p>
</div>

<h3>Individual Student Trend</h3>
<select id="studentSelect" onchange="updateStudentTrend()"><option value="">Select Student</option></select>
<canvas id="trendChart"></canvas>
</div>

<script>
let students = [];
let classChartInstance;
let trendChartInstance;

function addStudent(){
const name = document.getElementById("name").value.trim();
const week = parseInt(document.getElementById("week").value);
const attendance = parseFloat(document.getElementById("attendance").value);
const internal = parseFloat(document.getElementById("internal").value);
const external = parseFloat(document.getElementById("external").value);
const studyHours = parseFloat(document.getElementById("studyHours").value);
const behavior = parseFloat(document.getElementById("behavior").value);

if(!name || isNaN(week) || isNaN(attendance) || isNaN(internal) || isNaN(external) || isNaN(studyHours) || isNaN(behavior)){
alert("Please fill all fields correctly.");
return;
}

let predictedGrade = (attendance*0.2)+(internal*1.3)+(external*1.1)+(studyHours*1.2)+(behavior*3);
predictedGrade = Math.min(100, Math.round(predictedGrade));
const pass = predictedGrade>=50;
const categoryRecommendation = {
attendance: attendance<75?"Improve attendance.":"Good attendance.",
study: studyHours<10?"Increase study hours.":"Study hours sufficient.",
behavior: behavior<3?"Work on behavior & engagement.":"Behavior is good."
};

let student = students.find(s=>s.name===name);
if(!student){ student={name, history:[]}; students.push(student);}
student.history.push({week, attendance, internal, external, studyHours, behavior, predictedGrade, pass, categoryRecommendation});

document.getElementById("studentForm").reset();
updateDashboard();
updateStudentDropdown();
}

function generateCategoryText(rec){
return `<b>Attendance:</b> ${rec.attendance}<br><b>Study:</b> ${rec.study}<br><b>Behavior:</b> ${rec.behavior}`;
}

function updateDashboard(){
document.getElementById("dashboard").classList.remove("hidden");
const tbody=document.querySelector("#studentTable tbody");
tbody.innerHTML="";
students.forEach(s=>{
const latest=s.history[s.history.length-1];
const risk=latest.predictedGrade<50?"🚨 High":latest.predictedGrade<65?"⚠️ Moderate":"✅ Low";
tbody.insertAdjacentHTML("beforeend",
`<tr>
<td>${s.name}</td>
<td>${latest.predictedGrade}</td>
<td>${latest.pass?"✅ Pass":"❌ Fail"}</td>
<td>${risk}</td>
<td>${generateCategoryText(latest.categoryRecommendation)}</td>
</tr>`
);
});

// Summary
const allGrades = students.map(s=>s.history[s.history.length-1].predictedGrade);
const avgGrade=(allGrades.reduce((a,b)=>a+b,0)/allGrades.length).toFixed(1);
const passRate=((students.filter(s=>s.history[s.history.length-1].pass).length/students.length)*100).toFixed(1);
const highRisk=students.filter(s=>s.history[s.history.length-1].predictedGrade<50).length;
document.getElementById("summaryText").innerHTML=`Average Grade: <b>${avgGrade}</b><br>Pass Rate: <b>${passRate}%</b><br>High-Risk Students: <b>${highRisk}</b>`;

// Class chart
const ctx=document.getElementById("classChart").getContext("2d");
if(classChartInstance) classChartInstance.destroy();
classChartInstance=new Chart(ctx,{
type:'bar',
data:{labels:students.map(s=>s.name),datasets:[{label:'Predicted Grade',data:students.map(s=>s.history[s.history.length-1].predictedGrade),backgroundColor:students.map(s=>s.history[s.history.length-1].predictedGrade<50?"#e74c3c":s.history[s.history.length-1].predictedGrade<65?"#f1c40f":"#2ecc71")}]},
options:{plugins:{legend:{display:false},title:{display:true,text:'Class Performance',color:'#fff'}},scales:{x:{ticks:{color:'#fff'}},y:{beginAtZero:true,max:100,ticks:{color:'#fff'}}}}
});
}

function updateStudentDropdown(){
const select=document.getElementById("studentSelect");
select.innerHTML='<option value="">Select Student</option>';
students.forEach(s=>{ select.innerHTML+=`<option value="${s.name}">${s.name}</option>`; });
}

function updateStudentTrend(){
const studentName=document.getElementById("studentSelect").value;
if(!studentName) return;
const student=students.find(s=>s.name===studentName);
const labels=student.history.map(h=>`Week ${h.week}`);
const data=student.history.map(h=>h.predictedGrade);
const ctx=document.getElementById("trendChart").getContext("2d");
if(trendChartInstance) trendChartInstance.destroy();
trendChartInstance=new Chart(ctx,{
type:'line',
data:{labels,datasets:[{label:'Predicted Grade',data,borderColor:'#00c896',backgroundColor:'rgba(0,200,150,0.2)',fill:true}]},
options:{scales:{y:{beginAtZero:true,max:100},x:{ticks:{color:'#fff'}}}}
});
}
</script>
</body>
</html>
